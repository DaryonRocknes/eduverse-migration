; ============================================================
;  Reglages de la migration EDUVERSE
;  A remplir UNE SEULE FOIS par Webtinix lors de l'installation.
;  La personne qui migre n'a PAS besoin d'y toucher.
;  Les mots de passe ne sont JAMAIS recopies dans le journal.
; ============================================================

[postgres]
; Chemin du programme psql.
;  - Windows : C:\Program Files\PostgreSQL\17\bin\psql.exe  (adapter la version)
;              Si ce chemin n'existe pas, l'outil prend tout seul la version
;              installee la plus recente (C:\Program Files\PostgreSQL\*\bin).
;  - Linux   : psql
psql = psql
host = localhost
port = 5432
user = postgres
password =
database = eduverse

[mysql]
; Chemin du programme mysql.
;  - Windows : C:\xampp\mysql\bin\mysql.exe
;  - Linux   : /opt/lampp/bin/mysql
mysql = /opt/lampp/bin/mysql
host = localhost
port = 3306
user = root
password =
; ATTENTION : cette base est SUPPRIMEE puis recreee a chaque migration.
database = eduverse
; Fichier du schema EDUVERSE a charger (a cote du programme, ou chemin complet).
schema_file = schema_mysql.sql

[migration]
; Fuseau horaire de l'ecole = valeur de $Timezone dans config.inc.php
; d'Eduverse (ex. Africa/Brazzaville, Africa/Abidjan, Europe/Paris).
; Sert a convertir les dates "avec fuseau" (timestamptz) en heure locale.
; Vide = fuseau du serveur PostgreSQL.
fuseau_horaire =
