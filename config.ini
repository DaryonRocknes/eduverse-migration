; ============================================================
;  Reglages de la migration EDUVERSE
;  A remplir UNE SEULE FOIS par Webtinix lors de l'installation.
;  La personne qui migre n'a PAS besoin d'y toucher.
; ============================================================

[postgres]
; Chemin du programme psql.
;  - Windows : C:\Program Files\PostgreSQL\16\bin\psql.exe  (adapter la version)
;  - Linux   : psql
psql = psql
host = localhost
port = 5432
user = postgres
password =
database = eduverse

[mysql]
; Chemin du programme mysql.
;  - Windows : C:\xampp\mysql\bin\mysql.exe
;  - Linux   : /opt/lampp/bin/mysql
mysql = /opt/lampp/bin/mysql
host = localhost
port = 3306
user = root
password =
database = eduverse
; Fichier du schema EDUVERSE a charger (a cote du programme, ou chemin complet).
schema_file = schema_mysql.sql
